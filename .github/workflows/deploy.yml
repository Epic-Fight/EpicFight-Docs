name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main          
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CI: "true"                                          
      GOOGLE_ANALYTICS_KEY: ${{ secrets.GOOGLE_ANALYTICS_KEY }}
    steps:
      # Check out the repo (full history needed for git-revision-date and git-committers)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full git history for date/committer plugins

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libfreetype6-dev \
            libffi-dev \
            libjpeg-dev \
            libpng-dev \
            libz-dev \
            pango1.0-tools

      - name: Install Poetry
        run: |
          pip install poetry==1.8.5

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --only docs

      # Build the site
      - name: Build MkDocs site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # needed by git-committers plugin
        run: |
          mkdocs build --clean --site-dir ./site

      # Upload the built site as an artifact for the deploy job
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
